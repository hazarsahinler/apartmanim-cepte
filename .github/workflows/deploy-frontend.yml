name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build
        working-directory: ./frontend
        run: CI=false npm run build
        env:
          REACT_APP_API_URL: https://apartmanimcepte.me/api

      - name: Deploy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "frontend/build/*"
          target: "/tmp/frontend-build/"
          strip_components: 2

      - name: Copy to Docker container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Clean container html folder
            docker exec apartman-frontend rm -rf /usr/share/nginx/html/*
            # Copy new build files to container
            docker cp /tmp/frontend-build/. apartman-frontend:/usr/share/nginx/html/
            # Fix permissions
            docker exec apartman-frontend chmod -R 755 /usr/share/nginx/html/
            # Clean temp folder
            rm -rf /tmp/frontend-build
            # Verify deployment
            docker exec apartman-frontend ls -la /usr/share/nginx/html/
            echo "Deployment completed!"
